project_id = "buildtrack"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:4173"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[storage]
enabled = true
file_size_limit = "20MiB"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.command]
verify_jwt = true
[functions.request-upload]
verify_jwt = true
[functions.finalize-upload]
verify_jwt = true
[functions.request-download]
verify_jwt = true
[functions.invite-user]
verify_jwt = true
[functions.request-export]
verify_jwt = true
[functions.dispatch-notifications]
verify_jwt = false
[functions.scheduled-cleanup]
verify_jwt = false
